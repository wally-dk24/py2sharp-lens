# Py2Sharp Lens with a local Ollama sidecar.
#
#   docker compose up            # app on http://localhost:8000 (annotate-only banner)
#   docker compose exec ollama ollama pull qwen2.5-coder:7b
#
# Then set LLM_PROVIDER=openai_compat (in .env or the environment below) and
# point the app at the sidecar: inside compose the app reaches Ollama at
# http://ollama:11434/v1 (NOT localhost — localhost is the app container itself).
services:
  lens:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
